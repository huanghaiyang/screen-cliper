[package]
name = "screen-cliper"
version = "0.1.0"
edition = "2021"
description = "ScreenCliper - a snip & annotate screenshot tool for Windows"
authors = ["ScreenCliper"]
license = "MIT"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
xcap = "0.9"
arboard = { version = "3.4", default-features = false, features = ["image-data"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
winreg = "0.52"
global-hotkey = "0.6"
tray-icon = "0.19"
ab_glyph = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
